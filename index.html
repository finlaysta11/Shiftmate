<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShiftMate</title>
<meta name="theme-color" content="#F4F3F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShiftMate">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F3F6;--card:#fff;--ink:#17121A;--mut:#6F6874;--soft:#A29BA7;--line:#ECE9EF;
--wine:#7A1F2B;--wine2:#A3293B;--rose:#E36A7A;--wineL:#F8E9EC;--ok:#0E8F7E;--okL:#E3F6F1;--amb:#D97F00;--ambL:#FFF3DC;--red:#D93A3A;
--grad:linear-gradient(135deg,#4E0F1B 0%,#7A1F2B 45%,#B8404F 100%);--r:24px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#E7E4EA;color:var(--ink);font-size:15.5px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;transition:transform .15s ease,opacity .15s}
button:active{transform:scale(.97)}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
header.top{padding:calc(env(safe-area-inset-top) + 16px) 18px 12px}
.eyebrow{font-size:13.5px;color:var(--mut);font-weight:600}
.h1{font-size:30px;font-weight:800;letter-spacing:-.9px;line-height:1.1}
.h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.fade{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.iconbtn{width:44px;height:44px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 1px 2px rgba(23,18,26,.06)}
.iconbtn i{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--rose);border:2px solid #fff}
.avatar{width:44px;height:44px;border-radius:16px;background:var(--grad);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;color:#fff;background:var(--grad);box-shadow:0 18px 40px -16px rgba(122,31,43,.55)}
.hero:before,.hero:after{content:'';position:absolute;border-radius:50%;filter:blur(2px)}
.hero:before{width:220px;height:220px;right:-70px;top:-90px;background:radial-gradient(circle,rgba(255,170,170,.45),transparent 70%)}
.hero:after{width:180px;height:180px;left:-60px;bottom:-110px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:13.5px;font-weight:600;opacity:.8}
.hero .num{font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin:2px 0 12px}
.gchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:30px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* search & pills */
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:0 16px;height:52px;margin:16px 0 12px;box-shadow:0 1px 2px rgba(23,18,26,.05)}
.search input{flex:1;outline:none;font-size:15.5px;font-weight:600}
.search input::placeholder{color:var(--soft);font-weight:500}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:40px;padding:0 16px;border-radius:14px;background:#fff;font-weight:700;font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(23,18,26,.05)}
.pill.on{background:var(--ink);color:#fff}
.sec{display:flex;align-items:baseline;margin:20px 2px 10px}
.sec span{font-size:13.5px;color:var(--mut);font-weight:700;margin-left:auto}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(23,18,26,.05),0 8px 24px -18px rgba(23,18,26,.25);margin-bottom:12px}
.job{display:block;width:100%;text-align:left}
.jtop{display:flex;gap:13px;align-items:flex-start}
.sq{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.jt{font-weight:800;font-size:16.5px;letter-spacing:-.2px;line-height:1.25}
.je{font-size:13.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.price{margin-left:auto;text-align:right;flex:none}
.price b{display:block;font-size:18px;font-weight:800;letter-spacing:-.4px}
.price span{font-size:12px;color:var(--soft);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:11px;background:#F4F3F6;color:#4D4652;white-space:nowrap}
.tag.ok{background:var(--okL);color:var(--ok)}
.tag.amb{background:var(--ambL);color:var(--amb)}
.tag.wine{background:var(--wineL);color:var(--wine)}
.urg{position:relative;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#F7B23B,#E36A7A,#F7B23B,#E36A7A,#F7B23B) border-box;background-size:100% 100%,300% 300%;border:2px solid transparent;animation:borderflow 5s linear infinite}
.urg.fade{animation:up .5s cubic-bezier(.2,.8,.2,1) both,borderflow 5s linear infinite}
@keyframes borderflow{to{background-position:0 0,100% 100%}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;background:var(--grad);color:#fff;font-weight:800;font-size:16.5px;letter-spacing:-.2px;box-shadow:0 12px 26px -12px rgba(122,31,43,.7)}
.btn.light{background:#fff;color:var(--wine);box-shadow:none}
.btn.out{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:none;color:var(--mut);box-shadow:none;height:46px;font-size:15px}
.btn:disabled{opacity:.45;box-shadow:none}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin:12px 0 4px}
/* floating nav */
nav.tabs{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:70px;border-radius:26px;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);box-shadow:0 16px 40px -14px rgba(23,18,26,.35),inset 0 0 0 1px rgba(255,255,255,.7);display:flex;align-items:center;padding:0 6px;z-index:10}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--soft)}
nav.tabs .ti{width:46px;height:32px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:background .2s}
nav.tabs button.on{color:var(--wine)}
nav.tabs button{position:relative;z-index:1}
/* detail page */
.page{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s linear .35s}
.page.show{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}
.phero{padding:calc(env(safe-area-inset-top) + 10px) 18px 22px;border-radius:0 0 32px 32px}
.glass{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 12px}
.stat{background:#fff;border-radius:18px;padding:12px;box-shadow:0 1px 2px rgba(23,18,26,.05)}
.stat small{display:block;font-size:11.5px;color:var(--soft);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.stat b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.3px;margin-top:3px;white-space:nowrap}
.stat span{font-size:12.5px;color:var(--mut);font-weight:600}
.daybar{position:relative;height:34px;border-radius:12px;background:#F4F3F6;margin:14px 0 6px;overflow:hidden}
.daybar i{position:absolute;top:5px;bottom:5px;border-radius:8px}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--soft);font-weight:700}
.meter{height:8px;border-radius:6px;background:#F0EDF2;overflow:hidden;flex:1}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#16A38F,#0E8F7E)}
.cta{position:absolute;left:0;right:0;bottom:0;padding:14px 18px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(to top,var(--bg) 65%,rgba(244,243,246,0))}
.star{color:#F2A900}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(23,12,18,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.dim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:32px;padding:12px 20px calc(env(safe-area-inset-bottom) + 18px);z-index:41;transform:translateY(110%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s linear .38s;max-height:88%;overflow-y:auto}
.sheet.show{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:40px;height:5px;border-radius:3px;background:#E4E0E7;margin:0 auto 16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border-radius:18px;background:#F6F5F8;margin-bottom:8px;font-weight:700;text-align:left;box-shadow:inset 0 0 0 1.5px transparent}
.opt.on{background:var(--wineL);box-shadow:inset 0 0 0 2px var(--wine)}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px #CFC8D3;margin-left:auto;flex:none}
.opt.on .radio{box-shadow:inset 0 0 0 7px var(--wine)}
.toast{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 10px);transform:translateY(-170%);background:rgba(23,18,26,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-weight:700;padding:14px 16px;border-radius:20px;z-index:60;transition:transform .4s cubic-bezier(.2,.8,.2,1);font-size:14.5px;line-height:1.35;display:flex;gap:10px;align-items:center;box-shadow:0 14px 34px -10px rgba(0,0,0,.45)}
.toast.show{transform:none}
/* timetable */
.days{display:flex;gap:6px;margin-bottom:16px}
.day{flex:1;border-radius:18px;background:#fff;padding:9px 0 8px;text-align:center;font-weight:700;color:var(--soft);font-size:12px;box-shadow:0 1px 2px rgba(23,18,26,.05)}
.day b{display:block;font-size:18px;color:var(--ink);letter-spacing:-.4px}
.day.on{background:var(--grad);color:rgba(255,255,255,.8)}
.day.on b{color:#fff}
.day .dots{display:flex;justify-content:center;gap:3px;margin-top:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.tl{position:relative;margin-left:50px}
.tl .hr{position:absolute;left:-50px;width:40px;text-align:right;font-size:11.5px;color:var(--soft);font-weight:700;transform:translateY(-7px)}
.tl .hl{position:absolute;left:0;right:0;border-top:1px solid #E9E6EC}
.blk{position:absolute;left:6px;right:0;border-radius:16px;padding:9px 12px;font-size:14px;font-weight:800;line-height:1.2;overflow:hidden;text-align:left;letter-spacing:-.2px}
.blk small{display:block;font-weight:600;opacity:.75;font-size:12px;margin-top:3px;letter-spacing:0}
.blk.cls{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(23,18,26,.06)}
.blk.cls:before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--wine)}
.blk.exam{background:repeating-linear-gradient(-45deg,#ECE8EE 0 8px,#F6F4F7 8px 16px);color:var(--ink)}
.blk.mine{background:linear-gradient(135deg,#17A592,#0E7F70);color:#fff;box-shadow:0 10px 22px -12px rgba(14,143,126,.8)}
.blk.free{background:rgba(14,143,126,.05);border:1.5px dashed rgba(14,143,126,.45);color:var(--ok);display:flex;flex-direction:column;justify-content:center}
.now{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--rose);z-index:3}
.now:before{content:'';position:absolute;left:-4px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--rose)}
/* segmented */
.seg{display:flex;background:#E9E6EC;border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{flex:1;height:40px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(23,18,26,.08)}
/* earnings */
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--soft);font-weight:700;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:12px;background:#EFE9F0}
.bars .cur i{background:var(--grad)}
.bars b{color:var(--ink);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:10px;font-weight:800}
.stepper button{width:36px;height:36px;border-radius:12px;background:#F4F3F6;font-size:19px;font-weight:800}
/* settings */
.group{background:#fff;border-radius:var(--r);padding:4px 16px;box-shadow:0 1px 2px rgba(23,18,26,.05);margin-bottom:12px}
.set{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set b{display:block;font-size:15.5px}
.set span{font-size:13px;color:var(--mut);line-height:1.3;display:block;font-weight:500}
.toggle{width:52px;height:32px;border-radius:20px;background:#DCD7DF;position:relative;transition:background .25s;flex:none}
.toggle:after{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:left .25s cubic-bezier(.2,.8,.2,1)}
.toggle.on{background:var(--ok)}
.toggle.on:after{left:23px}
/* onboarding */
.ob{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 22px);background:var(--bg)}
.ob.dark{background:radial-gradient(120% 70% at 85% 0%,#C44A5B 0%,rgba(196,74,91,0) 55%),radial-gradient(90% 60% at 0% 100%,#3B0A15 0%,rgba(59,10,21,0) 60%),linear-gradient(160deg,#5A1221,#7A1F2B 55%,#5A1221);color:#fff}
.feat{display:flex;gap:13px;align-items:center;padding:13px 14px;border-radius:20px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:10px;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.feat .sq{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.16)}
.demo{display:inline-flex;font-size:11.5px;font-weight:800;letter-spacing:.8px;padding:5px 10px;border-radius:10px;text-transform:uppercase;background:rgba(255,255,255,.16)}
.steps li{list-style:none;display:flex;gap:12px;align-items:center;padding:11px 0;font-weight:700;color:var(--soft);font-size:15px}
.steps li.done,.steps li.busy{color:var(--ink)}
.ck{width:28px;height:28px;border-radius:10px;background:#EDEAF0;display:flex;align-items:center;justify-content:center;flex:none}
.steps li.done .ck{background:var(--ok)}
.steps li.busy .ck{background:#fff;box-shadow:inset 0 0 0 2.5px var(--ok)}
.steps li.busy .ck:after{content:'';width:12px;height:12px;border-radius:50%;border:2.5px solid var(--ok);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.okbox{background:var(--okL);border-radius:20px;padding:14px 16px;color:#0B6E61;font-size:14.5px;line-height:1.45;font-weight:600}
.okbox b{display:flex;align-items:center;gap:8px;font-size:15.5px;margin-bottom:3px;font-weight:800}
.foot{font-size:12px;color:var(--soft);text-align:center;margin-top:16px;line-height:1.45;font-weight:600}

/* name */
.nameinput{width:100%;height:64px;border-radius:20px;background:#fff;padding:0 20px;font-size:22px;font-weight:800;letter-spacing:-.4px;outline:none;box-shadow:0 1px 2px rgba(23,18,26,.06),inset 0 0 0 2px transparent;transition:box-shadow .2s}
.nameinput:focus{box-shadow:0 8px 24px -12px rgba(122,31,43,.35),inset 0 0 0 2px var(--wine)}
.nameinput::placeholder{color:#C9C2CD;font-weight:700}
.bigav{width:96px;height:96px;border-radius:32px;background:var(--grad);color:#fff;font-weight:800;font-size:42px;display:flex;align-items:center;justify-content:center;margin:26px 0 22px;box-shadow:0 18px 36px -16px rgba(122,31,43,.7);letter-spacing:-1px}
.bigav.empty{background:#E9E5EC;color:#B9B1BD;box-shadow:none}
/* ---------- motion ---------- */
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.6;pointer-events:none}
.b1{width:280px;height:280px;background:#E36A7A;top:-80px;right:-90px;animation:float1 11s ease-in-out infinite alternate}
.b2{width:260px;height:260px;background:#2E0710;bottom:40px;left:-110px;animation:float2 13s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(-70px,90px) scale(1.15)}}
@keyframes float2{to{transform:translate(80px,-70px) scale(1.2)}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.mg{position:relative;border-radius:26px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);padding:14px 14px 12px;margin:22px 0 2px}
.mg-days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.mg-dl{text-align:center;font-size:11px;font-weight:700;opacity:.7;margin-bottom:6px}
.mg-col{position:relative;height:128px;border-radius:12px;background:rgba(255,255,255,.07)}
.mg-b{position:absolute;left:4px;right:4px;border-radius:7px}
.mg-c{background:rgba(255,255,255,.9);animation:mgCls 7.5s infinite both}
.mg-x{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.6) 0 4px,rgba(255,255,255,.22) 4px 8px);animation:mgCls 7.5s infinite both}
.mg-s{background:linear-gradient(135deg,#46D6BF,#13A08C);animation:mgShift 7.5s infinite both}
.mg-sel{animation:mgShift 7.5s infinite both,mgSel 7.5s infinite both}
.mg-chk{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;animation:mgCheck 7.5s infinite both}
.mg-coin{position:absolute;right:12px;top:-12px;background:#fff;color:#0E8F7E;font-weight:800;font-size:13px;padding:6px 11px;border-radius:12px;box-shadow:0 10px 22px -8px rgba(0,0,0,.4);animation:mgCoin 7.5s infinite both}
.mg-cap{position:relative;height:24px;margin-top:12px;font-size:14px;font-weight:700}
.mg-cap span{position:absolute;inset:0;display:flex;align-items:center;gap:9px;opacity:0}
.mg-cap span:nth-child(1){animation:cap1 7.5s infinite}
.mg-cap span:nth-child(2){animation:cap2 7.5s infinite}
.mg-cap span:nth-child(3){animation:cap3 7.5s infinite}
.mg-cap b{width:22px;height:22px;border-radius:8px;background:rgba(255,255,255,.2);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
@keyframes mgCls{0%{opacity:0;transform:scaleY(.3)}8%,93%{opacity:1;transform:none}100%{opacity:0}}

{

const LOGO='<svg viewBox="0 0 120 120" width="100%" height="100%"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A1221"/><stop offset="1" stop-color="#B8404F"/></linearGradient></defs><rect width="120" height="120" rx="32" fill="url(#lg)"/><rect x="28" y="34" width="64" height="56" rx="12" fill="none" stroke="#fff" stroke-width="7"/><line x1="28" y1="51" x2="92" y2="51" stroke="#fff" stroke-width="7"/><line x1="46" y1="25" x2="46" y2="40" stroke="#fff" stroke-width="7" stroke-linecap="round"/><line x1="74" y1="25" x2="74" y2="40" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M45 70 L56 80 L76 60" stroke="#8FE3D3" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- demo data ---------- */

const DATES=[30,1,2,3,4,5,6];

 {id:'s2',role:'Catering assistant',emp:'Stadskeuken Catering',cat:'food',d:1,s:14,e:18,rate:13.8,loc:'Zernike Campus',km:3.4,rt:4.3,n:21,fair:4.4,paid:4.2,desc:'Set up and serve lunch and drinks at a conference on campus.'},
 {id:'s4',role:'Bike courier',emp:'Fietsenhub',cat:'bike',d:3,s:17,e:21,rate:14,loc:'City centre',km:1.5,rt:4.4,n:17,fair:4.5,paid:4.4,desc:'Deliver orders by e-bike in the city centre. Bike and rain gear provided.'},
 {id:'s5',role:'Event staff',emp:'Noorderlicht Events',cat:'mic',d:4,s:18,e:23,rate:14.5,loc:'Concert hall',km:1.2,rt:4.6,n:38,fair:4.7,paid:4.5,desc:'Bar support during a sold-out show.'},
 {id:'s6',role:'Shop assistant',emp:'Boekwinkel Zuid',cat:'book',d:5,s:10,e:16,rate:13.2,loc:'Helpman',km:2.1,rt:4.1,n:12,fair:4.3,paid:4.0,desc:'Help customers, restock shelves and work the till on a busy Saturday.'},
 {id:'s7',role:'Stock assistant',emp:'Fietsenhub',cat:'box',d:6,s:12,e:17,rate:13.5,loc:'Industrial area',km:4.0,rt:4.4,n:17,fair:4.5,paid:4.4,desc:'Unpack deliveries and prepare the shop for the week.'}
];

 {id:'p1',role:'Event staff',emp:'Noorderlicht Events',cat:'mic',when:'Sat 22 Nov',h:5,pay:72.5},
 {id:'p2',role:'Barista',emp:'Café Hoekje',cat:'coffee',when:'Thu 20 Nov',h:4,pay:62.0},
 {id:'p3',role:'Catering assistant',emp:'Stadskeuken Catering',cat:'food',when:'Wed 12 Nov',h:4.5,pay:62.1}
];

/* ---------- state ---------- */
const DEF={onboarded:false,uni:null,examPause:true,alerts:true,accepted:[],swapped:[],rated:{},limit:16,plus:false,tab:'shifts',filter:'all',day:TODAY,urgentSeen:false,mineTab:'up'};
let S; try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('shiftmate')||'{}'))}catch(e){S=Object.assign({},DEF)}
const save=()=>{try{localStorage.setItem('shiftmate',JSON.stringify(S))}catch(e){}};
let query='';

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const fmt=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')};
const eur=v=>'€'+v.toFixed(2);
const hrs=s=>s.e-s.s, pay=s=>s.rate*hrs(s);
const dayLabel=d=>d===TODAY?'Today':d===TODAY+1?'Tomorrow':DAYS[d]+' '+DATES[d]+(d===0?' Nov':' Dec');
const isExamDay=d=>CLASSES.some(c=>c.d===d&&c.exam);
const visible=()=>SHIFTS.filter(s=>!S.swapped.includes(s.id)&&!(S.examPause&&isExamDay(s.d)));
const byId=id=>SHIFTS.find(s=>s.id===id);
const rating=r=>`<span class="row" style="gap:3px;color:var(--ink)">${sv(P.star,13,'#F2A900')}<b style="font-size:13px">${r.toFixed(1)}</b></span>`;
function fitText(s){
  const cs=CLASSES.filter(c=>c.d===s.d).sort((a,b)=>a.s-b.s);
  const before=cs.filter(c=>c.e<=s.s).pop(), after=cs.find(c=>c.s>=s.e);
  if(!cs.length) return `No classes on ${DAYF[s.d]}, so your whole day is free.`;
  let t=''; if(before) t+=`Your last class, ${before.t}, ends at ${fmt(before.e)}. `;
  if(after) t+=`Your next class starts at ${fmt(after.s)}. `;
  return t+'No clash with your timetable.';
}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

const ini=n=>{n=(n||'').trim();return n?esc(n[0].toUpperCase()):'?'};

function countUps(root){(root||document).querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,suf=el.dataset.suf||'',f=el.dataset.eur?eur:(v=>Math.round(v)+'');if(RM){el.textContent=f(to)+suf;return}const t0=performance.now(),D=950;const st=n=>{const u=Math.min(1,(n-t0)/D),e=1-Math.pow(1-u,3);el.textContent=f(to*e)+suf;if(u<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
function celebrate(s){
  if(RM) return;

  const c=document.createElement('div');c.className='celeb';

  h+=`<div class="cbadge"><svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="33" fill="#13A08C"/><path class="draw" d="M22 36 31 45 49 26" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

  c.innerHTML=h;$('app').appendChild(c);setTimeout(()=>c.remove(),3000);
}
function mgHTML(){
  const PH=128/14,top=h=>((h-8)*PH).toFixed(1)+'px',ht=(a,b)=>((b-a)*PH).toFixed(1)+'px';
  const C=[[0,9,12],[0,13,15],[1,10,13],[2,9,11],[2,14,17],[3,11,13]],X=[4,10,12],SH=[[0,17,22],[1,14,18],[2,17.5,21.5,1],[3,17,21]];
  let cols='';
  for(let d=0;d<5;d++){
    let b='';

    cols+=`<div><div class="mg-dl">${DAYS[d]}</div><div class="mg-col">${b}</div></div>`;
  }
  return `<div class="mg fade" style="animation-delay:.1s"><span class="mg-coin">+€68.00</span><div class="mg-days">${cols}</div>

}

/* ---------- onboarding ---------- */

function renderOB(){
  const o=$('ob');
  if(S.onboarded){o.innerHTML='';return}
  if(obStep===0){
    o.innerHTML=`<div class="ob dark" style="overflow:hidden"><i class="blob b1"></i><i class="blob b2"></i>

        <div class="fade" style="font-size:16.5px;margin:10px 0 18px;opacity:.82;font-weight:500;line-height:1.45;animation-delay:.26s">ShiftMate shows student jobs that never clash with your classes or exams.</div>

function vCal(){
  const uni=S.uni!==null?UNIS[S.uni].replace('University of Applied Sciences','UAS'):'your university';
  $('hdr').innerHTML=`<div class="row"><div><div class="eyebrow">Week 49 · synced with ${uni}</div><div class="h1">Timetable</div></div><div class="sp"></div><span class="tag ok" style="background:#fff">${sv(P.refresh,14,'#0E8F7E',2.2)}Synced</span></div>`;
  const d=S.day, H0=8, H1=24, PX=48;
  const cls=CLASSES.filter(c=>c.d===d), mine=SHIFTS.filter(s=>s.d===d&&S.accepted.includes(s.id));
  const avail=visible().filter(s=>s.d===d&&!S.accepted.includes(s.id));
  const exam=isExamDay(d)&&S.examPause;
  const busy=[...cls,...mine].map(x=>[x.s,x.e]).sort((a,b)=>a[0]-b[0]);
  const free=[]; let cur=H0;
  for(const [a,b] of busy){if(a-cur>=2) free.push([cur,a]); cur=Math.max(cur,b)}
  if(H1-cur>=2) free.push([cur,H1]);
  let h=`<div class="days fade">${DAYS.map((n,k)=>{const c=CLASSES.filter(x=>x.d===k),m=SHIFTS.filter(s=>s.d===k&&S.accepted.includes(s.id));return `<button class="day ${k===d?'on':''}" data-d="${k}">${n}<b>${DATES[k]}</b><div class="dots">${c.map(x=>`<i style="background:${k===d?'#fff':x.exam?'#A29BA7':'#7A1F2B'}"></i>`).join('')}${m.map(()=>`<i style="background:${k===d?'#8FE3D3':'#0E8F7E'}"></i>`).join('')}</div></button>`}).join('')}</div>`;
  h+=`<div class="row fade" style="margin-bottom:14px;animation-delay:.04s"><div class="h2">${DAYF[d]}${d===TODAY?' · Today':''}</div><div class="sp"></div>${exam?`<span class="tag">${sv(P.moon,13,'#4D4652',2.2)}Exam day · paused</span>`:avail.length?`<span class="tag ok"><span class="dot"></span>${avail.length} shift${avail.length>1?'s':''} available</span>`:''}</div>`;
  h+=`<div class="tl fade" style="height:${(H1-H0)*PX}px;animation-delay:.08s">`;
  for(let x=H0;x<H1;x+=2) h+=`<div class="hr" style="top:${(x-H0)*PX}px">${fmt(x)}</div><div class="hl" style="top:${(x-H0)*PX}px"></div>`;
  if(!exam) for(const [a,b] of free){const n=avail.filter(s=>s.s>=a&&s.e<=b).length;
    h+=`<button class="blk free pop" style="animation-delay:.25s;top:${(a-H0)*PX+3}px;height:${(b-a)*PX-6}px" onclick="S_go()"><span class="row" style="gap:6px">${sv(P.plus,15,'#0E8F7E',2.6)}Free ${fmt(a)}–${b===24?'24:00':fmt(b)}</span><small>${n?`${n} shift${n>1?'s':''} fit here`:'No shifts yet'}</small></button>`;}
  cls.forEach((c,i)=>h+=`<div class="blk pop ${c.exam?'exam':'cls'}" style="animation-delay:${.1+i*.07}s;top:${(c.s-H0)*PX+3}px;height:${(c.e-c.s)*PX-6}px;${c.exam?'':'padding-left:16px'}">${c.t}<small>${fmt(c.s)}–${fmt(c.e)} · ${c.r}</small></div>`);
  for(const s of mine) h+=`<button class="blk mine pop" style="animation-delay:.3s;top:${(s.s-H0)*PX+3}px;height:${(s.e-s.s)*PX-6}px" onclick="openShift('${s.id}')">${s.role} · ${s.emp}<small>${fmt(s.s)}–${fmt(s.e)} · ${eur(pay(s))}</small></button>`;
  if(d===TODAY) h+=`<div class="now" style="top:${(NOW-H0)*PX}px"></div>`;
  h+='</div>';
  $('main').innerHTML=h;
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.day=+b.dataset.d;save();vCal()});
}
window.S_go=()=>{S.filter='all';go('shifts')};

/* ---------- my shifts ---------- */
function vMine(){
  $('hdr').innerHTML=`<div class="eyebrow">Your work</div><div class="h1">My shifts</div>`;
  const up=SHIFTS.filter(s=>S.accepted.includes(s.id)).sort((a,b)=>a.d-b.d||a.s-b.s);
  let h=`<div class="seg"><button class="${S.mineTab==='up'?'on':''}" data-m="up">Upcoming${up.length?' · '+up.length:''}</button><button class="${S.mineTab==='past'?'on':''}" data-m="past">Past · ${PAST.length}</button></div>`;
  if(S.mineTab==='up'){
    h+=up.length?up.map((s,i)=>`<div class="card fade" style="animation-delay:${i*.05}s"><button class="job" onclick="openShift('${s.id}')"><div class="jtop">${catIcon(s.cat)}<div style="flex:1"><div class="jt">${s.role}</div><div class="je">${s.emp}</div></div><div class="price"><b style="color:var(--ok)">${eur(pay(s))}</b><span>${hrs(s)} hours</span></div></div>
      <div class="meta"><span class="tag">${sv(P.clock,13,'#4D4652',2.2)}${dayLabel(s.d)} · ${fmt(s.s)}–${fmt(s.e)}</span><span class="tag ok">${sv(P.check,13,'#0E8F7E',3)}Confirmed</span></div></button>
      <button class="btn out" style="height:46px;margin-top:12px;font-size:14.5px" onclick="openSwap('${s.id}')">${sv(P.swap,18,'#17121A')}Swap shift</button></div>`).join('')
      :`<div class="card empty fade"><div style="width:60px;height:60px;margin:0 auto">${LOGO}</div><b>No upcoming shifts</b>Accept a shift that fits your free time.<button class="btn" style="margin-top:16px;height:50px" onclick="go('shifts')">Find shifts</button></div>`;
  } else {
    h+=PAST.map((p,i)=>{const r=S.rated[p.id];return `<div class="card fade" style="animation-delay:${i*.05}s"><div class="jtop">${catIcon(p.cat)}<div style="flex:1"><div class="jt">${p.role}</div><div class="je">${p.emp} · ${p.when}</div></div><div class="price"><b>${eur(p.pay)}</b><span>${p.h} h · paid</span></div></div>
      ${r?`<div class="meta"><span class="tag wine">You rated ${r}/5</span><span class="tag ok">${sv(P.check,13,'#0E8F7E',3)}Paid on time</span></div>`:`<button class="btn out" style="height:46px;margin-top:12px;font-size:14.5px" onclick="openRate('${p.id}')">${sv(P.star,17,'#F2A900')}Rate this employer</button>`}</div>`}).join('');
  }
  $('main').innerHTML=h;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mineTab=b.dataset.m;save();vMine()});
}

/* ---------- earnings ---------- */
function vEarn(){
  $('hdr').innerHTML=`<div class="eyebrow">Hours and money in one place</div><div class="h1">Earnings</div>`;
  const up=SHIFTS.filter(s=>S.accepted.includes(s.id));
  const pH=up.reduce((a,s)=>a+hrs(s),0), pE=up.reduce((a,s)=>a+pay(s),0);
  const earned=PAST.reduce((a,p)=>a+p.pay,0), eh=PAST.reduce((a,p)=>a+p.h,0);
  const weeks=[...WEEKS,{w:'This wk',h:pH,cur:true}], mx=Math.max(S.limit,...weeks.map(w=>w.h));
  const pct=Math.min(1,pH/S.limit), over=pH>S.limit, R=40, C=2*Math.PI*R;
  $('main').innerHTML=`
   <div class="hero fade"><span class="shine"></span><div class="lbl">Earned in November</div><div class="num" data-count="${earned}" data-eur="1">${eur(earned)}</div>
     <div class="row" style="gap:6px;flex-wrap:wrap"><span class="gchip">${eh} hours</span><span class="gchip">${PAST.length} shifts</span><span class="gchip">${sv(P.check,13,'#fff',3)}All paid on time</span></div></div>
   <div class="card fade" style="margin-top:12px;animation-delay:.05s"><div class="row" style="gap:16px">
     <svg width="100" height="100" viewBox="0 0 100 100" style="flex:none"><circle cx="50" cy="50" r="${R}" fill="none" stroke="#F0EDF2" stroke-width="11"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="${over?'#D93A3A':'#0E8F7E'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 50 50)" class="ring" style="--c:${C}"/><text x="50" y="48" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="19" fill="#17121A">${pH}h</text><text x="50" y="64" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="700" font-size="10.5" fill="#A29BA7">of ${S.limit}h</text></svg>
     <div style="flex:1"><b>Weekly hour limit</b><div class="mut" style="font-size:13.5px;font-weight:500;line-height:1.4;margin:3px 0 10px">${over?`You planned ${pH} h, more than your limit.`:'ShiftMate warns you before you go over it.'}</div>
       <div class="stepper"><button onclick="setLimit(-2)">−</button>${S.limit} h<button onclick="setLimit(2)">+</button></div></div></div></div>
   <div class="card fade" style="animation-delay:.1s"><div class="row"><div><b>Planned this week</b><div class="mut" style="font-size:13.5px;font-weight:600">${up.length} shift${up.length===1?'':'s'} accepted</div></div><div class="sp"></div><div style="text-align:right"><div style="font-size:22px;font-weight:800;color:var(--ok);letter-spacing:-.5px">${eur(pE)}</div><div class="mut" style="font-size:13px;font-weight:600">${pH} hours</div></div></div></div>
   <div class="card fade" style="animation-delay:.15s"><b>Hours per week</b>
     <div class="bars">${weeks.map((w,i)=>`<div class="${w.cur?'cur':''}"><b>${w.h}h</b><i style="height:${Math.max(6,w.h/mx*100)}px;animation-delay:${.25+i*.1}s"></i>${w.w}</div>`).join('')}</div></div>`;
  countUps($('main'));
}
window.setLimit=v=>{S.limit=Math.min(40,Math.max(4,S.limit+v));save();vEarn()};

/* ---------- profile ---------- */
let syncing=false;
function vMe(){
  $('hdr').innerHTML=`<div class="eyebrow">Account and settings</div><div class="h1">Profile</div>`;
  const u=S.uni!==null?UNIS[S.uni]:'Not connected';
  const ico=(d,bg,c)=>`<span class="sq" style="width:40px;height:40px;border-radius:13px;background:${bg}">${sv(d,20,c)}</span>`;
  $('main').innerHTML=`
   <div class="card fade row" style="gap:14px"><div class="avatar" style="width:60px;height:60px;border-radius:20px;font-size:24px">${ini(S.name)}</div><div style="flex:1"><div style="font-weight:800;font-size:19px;letter-spacing:-.3px">${esc((S.name||'').trim()||'Student')}</div><div class="row" style="gap:6px;margin-top:2px"><span class="tag ok" style="padding:4px 9px">${sv(P.shield,13,'#0E8F7E',2.2)}Verified student</span></div></div><button class="pill" style="height:38px" onclick="editName()">Edit</button></div>
   <div class="group fade" style="animation-delay:.05s">
     <div class="set">${ico(P.grad,'#F8E9EC','#7A1F2B')}<div style="flex:1"><b>University timetable</b><span>${u}</span></div><button class="pill" style="height:36px" onclick="syncNow()">${syncing?'Syncing…':'Sync'}</button></div>
     <div class="set">${ico(P.moon,'#F1EAFE','#7A3FD1')}<div style="flex:1"><b>Exam pause</b><span>No shift suggestions on exam days</span></div><button class="toggle ${S.examPause?'on':''}" onclick="tg('examPause')"></button></div>
     <div class="set">${ico(P.bolt,'#FFF3DC','#D97F00')}<div style="flex:1"><b>Urgent shift alerts</b><span>Last-minute shifts with a higher hourly rate</span></div><button class="toggle ${S.alerts?'on':''}" onclick="tg('alerts')"></button></div>
     <div class="set">${ico(P.wallet,'#E3F6F1','#0E8F7E')}<div style="flex:1"><b>Weekly hour limit</b><span>${S.limit} hours per week</span></div><button onclick="go('earn')">${sv(P.chevron,20,'#A29BA7')}</button></div>
   </div>
   <div class="hero fade" style="animation-delay:.1s"><div class="row" style="gap:10px"><span class="sq" style="width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.16)">${sv(P.spark,20,'#fff')}</span><div style="font-weight:800;font-size:18px">ShiftMate Plus</div></div>
     <div style="opacity:.85;margin:10px 0 14px;line-height:1.45;font-weight:500">Get early access to urgent, higher-paid shifts before other students.</div>
     <button class="btn light" style="height:48px" onclick="joinPlus()">${S.plus?'On the waitlist ✓':'Join the waitlist'}</button></div>
   <button class="btn ghost" style="margin-top:8px" onclick="resetDemo()">Reset demo</button>
   <div class="foot">ShiftMate prototype for a university research project.<br>All employers, shifts and ratings are demo data.</div>`;
}
window.editName=function(first){
  const sh=$('sheet');let v=S.name||'';
  sh.innerHTML=`<div class="grab"></div><div class="h2" style="font-size:21px">${first?'What should we call you?':'Change your name'}</div>
   <div class="mut" style="margin:6px 0 16px;font-weight:500;line-height:1.45">Your name is only saved on this phone.</div>
   <input class="nameinput" id="ednm" maxlength="20" placeholder="Your first name" autocomplete="given-name" autocapitalize="words" enterkeyhint="done" value="${esc(v)}">
   <button class="btn" id="edok" style="margin-top:14px" ${v.trim()?'':'disabled'}>Save</button>${first?'':'<button class="btn ghost" onclick="closeSheet()">Cancel</button>'}`;
  const i=$('ednm'),ok=$('edok');
  i.oninput=()=>{v=i.value;ok.disabled=!v.trim()};
  const doSave=()=>{if(!v.trim())return;S.name=v.trim().slice(0,20);save();i.blur();closeSheet();render();toast(`<b>Hi, ${nm()}!</b><br>Your name has been saved.`,okIc)};
  ok.onclick=doSave; i.onkeydown=e=>{if(e.key==='Enter')doSave()};
  openSheet(); if(first) $('dim').onclick=null;
  setTimeout(()=>i.focus(),400);
};
window.tg=k=>{S[k]=!S[k];save();vMe();if(k==='examPause') toast(S.examPause?'<b>Exam pause on</b><br>No shift suggestions on exam days.':'<b>Exam pause off</b>',okIc)};
window.joinPlus=()=>{S.plus=true;save();vMe();toast('<b>You are on the waitlist</b><br>We will let you know when Plus launches.',okIc)};
window.syncNow=()=>{syncing=true;vMe();setTimeout(()=>{syncing=false;vMe();toast('<b>Timetable up to date</b><br>No changes this week.',okIc)},1300)};
window.resetDemo=()=>{try{localStorage.removeItem('shiftmate')}catch(e){} S=Object.assign({},DEF);obStep=0;obUni=null;obName='';query='';closePage();closeSheet();renderOB();render()};

/* ---------- start ---------- */
renderOB(); render();
if(S.onboarded&&!S.name) setTimeout(()=>editName(true),500); else if(S.onboarded) setTimeout(urgentAlert,800);
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
